name: MiniMax AI Coding Bot
on:
  issues:
    types:
      - opened
      - labeled
concurrency:
  group: minimax-issue-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  code-with-minimax:
    # Run when:
    # 1. A new issue is opened, or
    # 2. The ai-edit label is added to an existing issue.
    if: >
      github.event.action == 'opened' ||
      (
        github.event.action == 'labeled' &&
        github.event.label.name == 'ai-edit'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    timeout-minutes: 30
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Checkout Claude Engineer Framework
        uses: actions/checkout@v4
        with:
          repository: Doriandarko/claude-engineer
          path: agent_dir
          persist-credentials: false
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent_dir/requirements.txt
      - name: Install Claude Engineer Dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r agent_dir/requirements.txt
      - name: Configure Claude Engineer for MiniMax
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          config_path = Path("agent_dir/config.py")
          ce3_path = Path("agent_dir/ce3.py")
          config_text = config_path.read_text(encoding="utf-8")
          ce3_text = ce3_path.read_text(encoding="utf-8")
          old_model = 'MODEL = "claude-3-5-sonnet-20241022"'
          new_model = 'MODEL = os.getenv("MODEL_NAME", "MiniMax-M3")'
          if old_model not in config_text:
              raise RuntimeError(
                  "Could not find the expected MODEL setting in agent_dir/config.py"
              )
          config_text = config_text.replace(old_model, new_model, 1)
          old_client = (
              "self.client = anthropic.Anthropic("
              "api_key=Config.ANTHROPIC_API_KEY)"
          )
          new_client = (
              "self.client = anthropic.Anthropic(\n"
              "            api_key=Config.ANTHROPIC_API_KEY,\n"
              "            base_url=os.getenv(\n"
              '                "ANTHROPIC_BASE_URL",\n'
              '                "https://api.anthropic.com"\n'
              "            )\n"
              "        )"
          )
          if old_client not in ce3_text:
              raise RuntimeError(
                  "Could not find the expected Anthropic client initialization "
                  "in agent_dir/ce3.py"
              )
          ce3_text = ce3_text.replace(old_client, new_client, 1)
          config_path.write_text(config_text, encoding="utf-8")
          ce3_path.write_text(ce3_text, encoding="utf-8")
          print("Claude Engineer configured for MiniMax.")
          PY
      - name: Verify Required Secret
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MINIMAX_API_KEY:-}" ]; then
            echo "::error::The MINIMAX_API_KEY repository secret is missing."
            exit 1
          fi
      - name: Run Claude Engineer with MiniMax M3
        env:
          ANTHROPIC_BASE_URL: https://api.minimax.io/anthropic
          ANTHROPIC_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MODEL_NAME: MiniMax-M3
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPOSITORY: ${{ github.repository }}
          PROJECT_PATH: ${{ github.workspace }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import os
          from pathlib import Path
          prompt = f"""
          You are working as an autonomous coding agent inside a GitHub Actions
          runner.
          Repository:
          {os.environ["REPOSITORY"]}
          Repository location:
          {os.environ["PROJECT_PATH"]}
          GitHub issue:
          #{os.environ["ISSUE_NUMBER"]}
          Issue title:
          {os.environ["ISSUE_TITLE"]}
          Issue description:
          {os.environ.get("ISSUE_BODY", "")}
          Objective:
          Inspect the repository and implement the request described in the
          GitHub issue.
          Requirements:
          1. Work only inside the repository at {os.environ["PROJECT_PATH"]}.
          2. Read the relevant files before making changes.
          3. Make the smallest complete change that resolves the issue.
          4. Do not modify files inside the agent_dir directory.
          5. Preserve the existing project architecture and coding style.
          6. Do not expose API keys, secrets, tokens or environment variables.
          7. Run relevant tests, linters or validation commands when available.
          8. Do not create a Git commit or push a branch. GitHub Actions will
             handle that after you finish.
          9. Do not merely describe the solution. Edit the repository files.
          10. When the implementation is complete, stop.
          Begin by inspecting the repository.
          """
          Path("/tmp/minimax-prompt.txt").write_text(
              prompt.strip(),
              encoding="utf-8",
          )
          PY
          cd "$PROJECT_PATH"
          {
            cat /tmp/minimax-prompt.txt
            printf '\nquit\n'
          } | timeout 25m python agent_dir/ce3.py
      - name: Remove Claude Engineer Framework
        if: always()
        shell: bash
        run: |
          rm -rf agent_dir
          rm -f /tmp/minimax-prompt.txt
      - name: Show Repository Changes
        shell: bash
        run: |
          set -euo pipefail
          echo "Files changed by MiniMax:"
          git status --short
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "::warning::MiniMax completed without changing any repository files."
          fi
      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ai/minimax-issue-${{ github.event.issue.number }}
          delete-branch: true
          commit-message: |
            fix: address issue #${{ github.event.issue.number }}
            Changes generated by MiniMax M3.
          title: "AI fix: ${{ github.event.issue.title }}"
          body: |
            ## MiniMax M3 implementation
            This pull request was generated automatically for:
            - Issue: #${{ github.event.issue.number }}
            - Title: ${{ github.event.issue.title }}
            - Triggered by: @${{ github.actor }}
            ### Review notice
            Please review the generated changes and test results before merging.
            Closes #${{ github.event.issue.number }}
          labels: |
            ai-generated
            needs-review
          draft: true
      - name: Comment on Issue
        if: steps.create-pr.outputs.pull-request-number
        uses: actions/github-script@v7
        env:
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        with:
          script: |
            const body = [
              "MiniMax M3 created a draft pull request for this issue.",
              "",
              `Pull request: ${process.env.PR_URL}`,
              "",
              "Please review and test the changes before merging."
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
      - name: Report No Changes
        if: steps.create-pr.outputs.pull-request-operation == 'none'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "MiniMax M3 completed the run but did not produce any",
                "repository changes, so no pull request was created.",
                "",
                "Check the workflow logs for the model response and errors."
              ].join(" ")
            });