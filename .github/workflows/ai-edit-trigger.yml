name: MiniMax AI Coding Bot

on:
  issues:
    types:
      - labeled

concurrency:
  group: minimax-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  code-with-minimax:
    if: >
      github.event.action == 'labeled' &&
      github.event.label.name == 'ai-edit'

    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        shell: bash
        run: |
          set -euo pipefail

          npm install --global @anthropic-ai/claude-code

          echo "Installed Claude Code version:"
          claude --version

      - name: Verify MiniMax Secret
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${MINIMAX_API_KEY:-}" ]; then
            echo "::error::The MINIMAX_API_KEY repository secret is missing."
            exit 1
          fi

      - name: Build Issue Prompt
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          from pathlib import Path

          issue_body = os.environ.get("ISSUE_BODY", "").strip()

          prompt = f"""
          You are an autonomous coding agent running inside GitHub Actions.

          Repository:
          {os.environ["REPOSITORY"]}

          GitHub issue:
          #{os.environ["ISSUE_NUMBER"]}

          Issue title:
          {os.environ["ISSUE_TITLE"]}

          Issue description:
          {issue_body}

          Your task:
          Inspect this repository and implement the request described in the issue.

          Requirements:
          1. Read the relevant repository files before editing.
          2. Make the smallest complete set of changes needed to resolve the issue.
          3. Preserve the existing architecture, conventions, and formatting.
          4. Do not merely explain the solution. Modify the repository files.
          5. Do not modify files under .github/workflows unless the issue explicitly requires it.
          6. Do not expose secrets, API keys, tokens, or environment variables.
          7. Run relevant tests, linters, type checks, or build commands when available.
          8. Fix problems found by those checks when reasonably related to the issue.
          9. Do not create commits, branches, tags, or pull requests.
          10. Finish only after the requested implementation is present in the working tree.

          Begin by inspecting the repository.
          """

          Path("/tmp/minimax-issue-prompt.txt").write_text(
              prompt.strip() + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run Claude Code with MiniMax M3
        env:
          ANTHROPIC_BASE_URL: https://api.minimax.io/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.MINIMAX_API_KEY }}

          ANTHROPIC_MODEL: MiniMax-M3
          ANTHROPIC_DEFAULT_SONNET_MODEL: MiniMax-M3
          ANTHROPIC_DEFAULT_OPUS_MODEL: MiniMax-M3
          ANTHROPIC_DEFAULT_HAIKU_MODEL: MiniMax-M3

          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "1000000"
          CLAUDE_CODE_SKIP_PROMPT_HISTORY: "1"
        shell: bash
        run: |
          set -euo pipefail

          claude \
            --print \
            --model "MiniMax-M3" \
            --permission-mode bypassPermissions \
            --max-turns 40 \
            --no-session-persistence \
            --output-format text \
            "$(cat /tmp/minimax-issue-prompt.txt)" \
            2>&1 | tee /tmp/claude-code-output.txt

      - name: Show Agent Output
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/claude-code-output.txt ]; then
            echo "===== Claude Code output ====="
            cat /tmp/claude-code-output.txt
          else
            echo "No Claude Code output file was created."
          fi

      - name: Show Repository Changes
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Git status ====="
          git status --short

          echo "===== Diff summary ====="
          git diff --stat

      - name: Verify Repository Changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet &&
             [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Claude Code completed without modifying repository files."
            exit 1
          fi

      - name: Prevent Secret Files from Being Committed
        shell: bash
        run: |
          set -euo pipefail

          forbidden_files="$(git status --porcelain |
            awk '{print $2}' |
            grep -E '(^|/)(\.env($|\.)|.*\.pem$|.*\.key$|id_rsa$|id_ed25519$)' || true)"

          if [ -n "$forbidden_files" ]; then
            echo "::error::The agent created or modified potentially sensitive files:"
            echo "$forbidden_files"
            exit 1
          fi

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          branch: ai/minimax-issue-${{ github.event.issue.number }}
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true

          commit-message: |
            fix: address issue #${{ github.event.issue.number }}

            Generated using Claude Code with MiniMax M3.

          title: "AI fix: ${{ github.event.issue.title }}"

          body: |
            ## MiniMax M3 implementation

            This draft pull request was generated automatically using Claude Code with MiniMax M3.

            - Issue: #${{ github.event.issue.number }}
            - Triggered by: @${{ github.actor }}

            Review the implementation and test results before merging.

            Closes #${{ github.event.issue.number }}

          draft: true

      - name: Verify Pull Request Was Created
        if: steps.create-pr.outputs.pull-request-operation == 'none'
        shell: bash
        run: |
          echo "::error::Repository changes existed, but no pull request was created."
          exit 1

      - name: Comment on Issue
        if: steps.create-pr.outputs.pull-request-number
        uses: actions/github-script@v7
        env:
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
        with:
          script: |
            const body = [
              "MiniMax M3 completed the requested implementation.",
              "",
              `Draft pull request: ${process.env.PR_URL}`,
              "",
              "Please review and test the generated changes before merging."
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Upload Agent Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimax-issue-${{ github.event.issue.number }}-logs
          path: |
            /tmp/claude-code-output.txt
            /tmp/minimax-issue-prompt.txt
          if-no-files-found: ignore
          retention-days: 7