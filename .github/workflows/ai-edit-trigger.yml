      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Claude Engineer Framework
        uses: actions/checkout@v4
        with:
          repository: 'Doriandarko/claude-engineer'
          path: 'agent_dir'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Agent Dependencies
        run: |
          cd agent_dir
          pip install -r requirements.txt

      - name: Execute Claude Engineer via MiniMax M3
        env:
          ANTHROPIC_BASE_URL: "https://api.minimax.io/anthropic"
          ANTHROPIC_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MODEL_NAME: "MiniMax-M3"
          CE_MODEL: "MiniMax-M3"
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cd agent_dir
          
          PROMPT="Objective: Fix or implement the request described in this GitHub issue. Issue Title: $ISSUE_TITLE. Description: $ISSUE_BODY"
          
          # Launch Claude Engineer CLI against the target codebase in parent folder
          python ce3.py --project-path ../ --prompt "$PROMPT"
